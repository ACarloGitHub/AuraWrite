name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxml2-utils \
            file \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust targets (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AuraWrite ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurawrite-${{ matrix.os }}-bundles
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish release with all artifacts
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -print
          echo "=== File sizes ==="
          find artifacts -type f -exec ls -lh {} \;

      - name: Generate changelog from Conventional Commits
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = context.ref.replace(/^refs\/tags\//, '');

            // 1. Find previous tag (skip prereleases)
            const { data: tags } = await github.rest.repos.listTags({
              owner, repo, per_page: 10,
            });
            const stableTags = tags
              .map(t => t.name)
              .filter(n => /^v\d+\.\d+\.\d+$/.test(n))
              .filter(n => n !== currentTag)
              .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            const previousTag = stableTags[0] || null;

            // 2. Get commits between previous tag and current
            let commits = [];
            if (previousTag) {
              const { data } = await github.rest.repos.compareCommits({
                owner, repo, base: previousTag, head: currentTag,
              });
              commits = data.commits;
            } else {
              // No previous tag: take the last 50 commits
              const { data } = await github.rest.repos.listCommits({
                owner, repo, per_page: 50,
              });
              commits = data;
            }

            // 3. Categorize commits by Conventional Commits prefix
            const whatsnew = [];
            const improvements = [];
            const breaking = [];
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0];
              if (/^[a-zA-Z0-9_-]+!:/.test(msg) || /BREAKING CHANGE:/i.test(c.commit.message)) {
                breaking.push(msg);
              } else if (/^(feat|fix)(\([^)]+\))?!?:/i.test(msg)) {
                whatsnew.push(msg);
              } else if (/^(refactor|perf|docs)(\([^)]+\))?!?:/i.test(msg)) {
                improvements.push(msg);
              }
            }

            // 4. Build body
            const fmt = (arr) => arr.length
              ? arr.map(m => '- ' + m).join('\n')
              : '_No changes in this category — see commits on GitHub._';
            const sections = [
              "## What's new",
              fmt(whatsnew),
              "## Improvements",
              fmt(improvements),
            ];
            if (breaking.length > 0) {
              sections.push("## \u26A0\uFE0F Breaking changes");
              sections.push(fmt(breaking));
            }
            sections.push("## Notes");
            sections.push('- **Data preservation**: your data is preserved across this upgrade.');
            sections.push('- **Uninstall**: removing the app does not delete `%APPDATA%\\aurawrite\\` (Windows), `~/Library/Application Support/aurawrite/` (macOS), or `~/.config/aurawrite/` (Linux).');
            sections.push('- **No code signing**: AuraWrite is open source (MIT) but not yet code-signed. You may see a SmartScreen warning on Windows or Gatekeeper block on macOS — see the README\'s Security & Trust section.');
            sections.push("## Downloads");
            sections.push('- **Windows:** `.msi` (WiX) and `.exe` (NSIS) installers');
            sections.push('- **macOS:** Universal `.dmg` (Intel + Apple Silicon), `.app.tar.gz`');
            sections.push('- **Linux:** `.deb`, `.rpm`, and AppImage');

            const body = sections.join('\n\n');
            require('fs').writeFileSync('release_body.md', body);
            core.setOutput('has_commits', whatsnew.length + improvements.length + breaking.length);

      - name: Create or update release and attach all artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AuraWrite ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: release_body.md
          files: |
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
